<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MR. SHIP — AP CSP Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/hub.css" />
</head>
<body>
  <main>
    <header class="hub-header">
      <h1>MR. SHIP</h1>
      <div class="hub-byline">AP Computer Science Principles · Gonzaga Preparatory School</div>
      <p class="hub-tagline">Interactive tools for exploring computing concepts.</p>
    </header>

    <section class="hub-section">
      <div id="tools-grid" class="tools-grid"></div>
    </section>

    <footer class="hub-footer">
      Built by Mr. Ship &middot; 2025–2026
      &middot; <a href="https://github.com/amdg-shipley/networks" style="color:var(--muted)">GitHub</a>
    </footer>
  </main>

  <script type="module">
    import { initNav } from '/shared/nav.js';
    initNav();
  </script>
  <script type="module">
    import { TOOLS } from '/tools.js';

    const grid = document.getElementById('tools-grid');

    for (const tool of TOOLS) {
      if (tool.status !== 'live') continue;

      const card = document.createElement('a');
      card.href = tool.path;
      card.className = 'tool-card';
      card.dataset.color = tool.color;

      const badges = tool.apConcepts.map(ek =>
        `<span class="ek-badge ek-badge--covered">${ek}</span>`
      ).join('');

      card.innerHTML = `
        <div class="tool-icon">${tool.icon}</div>
        <div class="tool-unit">${tool.unit}</div>
        <h2 class="tool-title">${tool.title}</h2>
        <p class="tool-tagline">${tool.tagline}</p>
        <p class="tool-desc">${tool.description}</p>
        <div class="tool-concepts">${badges}</div>
      `;

      grid.appendChild(card);
    }
  </script>
</body>
</html>
